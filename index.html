<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Petualangan Ular Cerdas</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Load Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Load Canvas Confetti for effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Google Fonts: Fredoka One for cartoonish look -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling, act like an app */
            background-color: #1e1e1e; /* Fallback */
            touch-action: none; /* Prevent browser touch actions like pull-to-refresh */
        }
        
        h1, h2, h3, .cartoon-font {
            font-family: 'Fredoka One', cursive;
        }

        /* Custom scrollbar for text areas */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px;}
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Game Environment Animations */
        @keyframes wave {
            0% { transform: translateX(0); }
            50% { transform: translateX(-25%); }
            100% { transform: translateX(0); }
        }
        .animate-wave { animation: wave 10s ease-in-out infinite; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        @keyframes float-cloud {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-200px); }
        }
        .cloud { position: absolute; opacity: 0.8; animation: float-cloud linear infinite; }

        /* Character Animations */
        @keyframes snake-dance {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-15deg) scale(1.1); }
            50% { transform: rotate(0deg) scale(1); }
            75% { transform: rotate(15deg) scale(1.1); }
        }
        .anim-snake-dance { animation: snake-dance 0.5s ease-in-out infinite; }

        @keyframes mouse-laugh {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.2); }
        }
        .anim-mouse-laugh { animation: mouse-laugh 0.4s ease-in-out infinite; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        .anim-shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }

        @keyframes flash {
            0%, 100% { opacity: 0; background-color: transparent; }
            10%, 90% { opacity: 1; background-color: rgba(255, 255, 255, 0.8); }
        }
        .anim-flash { animation: flash 0.3s ease-out; position: absolute; inset: 0; z-index: 50; pointer-events: none; }

        @keyframes drop {
            0% { transform: translateY(0) rotate(0); opacity: 1; }
            100% { transform: translateY(100vh) rotate(45deg); opacity: 0; }
        }
        .anim-drop { animation: drop 1s forwards ease-in; }

        .game-container {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 3D Button styles */
        .btn-3d {
            transition: all 0.1s;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
        }
        .btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 rgba(0,0,0,0.2);
        }

        .platform {
            background: #8B4513;
            border-bottom: 8px solid #5C2E0B;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            position: relative;
            transition: all 0.3s ease;
        }
        .platform::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 10px;
            background: #A0522D;
            border-radius: 12px 12px 0 0;
        }

        .grass-top {
            position: absolute;
            top: -10px; left: -5px; right: -5px; height: 15px;
            background: #4ade80;
            border-radius: 10px;
            border-bottom: 4px solid #22c55e;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Simple Audio Engine using Web Audio API to avoid external dependencies
        const AudioEngine = (() => {
            let ctx = null;
            let enabled = true;

            const init = () => {
                if (!ctx) {
                    ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (ctx.state === 'suspended') ctx.resume();
            };

            const playOscillator = (freq, type, duration, vol = 0.1, slideFreq = null) => {
                if (!enabled || !ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                if (slideFreq) {
                    osc.frequency.exponentialRampToValueAtTime(slideFreq, ctx.currentTime + duration);
                }

                gain.gain.setValueAtTime(vol, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + duration);
            };

            return {
                enable: () => { enabled = true; init(); },
                disable: () => { enabled = false; },
                toggle: () => { enabled = !enabled; if(enabled) init(); return enabled; },
                isEnabled: () => enabled,
                
                playClick: () => playOscillator(600, 'sine', 0.1, 0.1),
                playCorrect: () => {
                    playOscillator(440, 'sine', 0.1, 0.1);
                    setTimeout(() => playOscillator(660, 'sine', 0.1, 0.1), 100);
                    setTimeout(() => playOscillator(880, 'sine', 0.2, 0.1), 200);
                },
                playWrong: () => {
                    playOscillator(300, 'sawtooth', 0.3, 0.1, 100);
                },
                playMove: () => playOscillator(200, 'sine', 0.1, 0.05, 300),
                playThunder: () => {
                    if (!enabled || !ctx) return;
                    const bufferSize = ctx.sampleRate * 1; // 1 second
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1; // White noise
                    }
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 1000;
                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.5, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
                    
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);
                    noise.start();
                },
                playBGM: () => {
                    // Simulating BGM is complex with pure Web Audio without buffers,
                    // We will skip continuous BGM to avoid annoying beep-boops, 
                    // and focus on rich sound effects for interactions.
                }
            };
        })();

        const QUESTION_BANK = [

            { id: 5, level: 1, text: "Norma kesopanan biasanya bersumber dari...", options: ["Undang-undang", "Kebiasaan pergaulan masyarakat", "Kitab suci", "Peraturan polisi"], answer: 1, explanation: "Norma kesopanan lahir dari tradisi dan pergaulan sehari-hari di masyarakat." },
            { id: 6, level: 1, text: "Aturan yang dibuat oleh negara dan memiliki sanksi tegas disebut norma...", options: ["Hukum", "Agama", "Kesusilaan", "Kesopanan"], answer: 0, explanation: "Norma hukum dibuat oleh lembaga resmi negara dan sanksinya nyata/tegas." },
            { id: 7, level: 1, text: "Sanksi bagi pelanggar norma agama adalah...", options: ["Denda uang", "Penjara", "Dosa", "Dikucilkan teman"], answer: 2, explanation: "Pelanggar norma agama akan mendapat sanksi berupa dosa dari Tuhan." },
            { id: 8, level: 1, text: "Merasa menyesal dan bersalah adalah sanksi jika kita melanggar norma...", options: ["Kesopanan", "Hukum", "Agama", "Kesusilaan"], answer: 3, explanation: "Melanggar hati nurani (kesusilaan) akan menimbulkan rasa penyesalan mendalam." },
            { id: 9, level: 1, text: "Sanksi berupa denda atau penjara diberikan kepada pelanggar norma...", options: ["Kesusilaan", "Kesopanan", "Hukum", "Agama"], answer: 2, explanation: "Hukum negara memiliki aparat yang berhak menghukum pelanggar dengan denda/penjara." },
            { id: 10, level: 1, text: "Dicemooh atau dikucilkan oleh masyarakat biasanya merupakan sanksi dari pelanggaran norma...", options: ["Hukum", "Agama", "Kesopanan", "Lalu lintas"], answer: 2, explanation: "Masyarakat akan menegur atau menjauhi orang yang tidak sopan." },

            { id: 13, level: 2, text: "Sebelum masuk ke rumah orang lain, kita sebaiknya...", options: ["Langsung masuk saja", "Mengintip dari jendela", "Mengetuk pintu dan permisi", "Berteriak memanggil"], answer: 2, explanation: "Mengetuk pintu adalah adab sopan santun bertamu." },
            { id: 14, level: 2, text: "Menghormati teman yang sedang menjalankan ibadah puasa merupakan wujud norma...", options: ["Hukum", "Agama", "Kesopanan", "Keluarga"], answer: 1, explanation: "Toleransi beragama adalah pelaksanaan perintah agama untuk saling menghargai." },
            { id: 15, level: 2, text: "Ayah selalu memakai helm saat mengendarai sepeda motor. Ayah mematuhi norma...", options: ["Kesusilaan", "Agama", "Hukum", "Kesopanan"], answer: 2, explanation: "Memakai helm adalah aturan tertulis dalam undang-undang lalu lintas (hukum)." },
            { id: 16, level: 2, text: "Saat makan bersama, Budi tidak mengecap (bersuara) dan makan dengan tenang. Ini sesuai dengan norma...", options: ["Kesopanan", "Hukum", "Agama", "Kesusilaan"], answer: 0, explanation: "Tata cara makan yang baik adalah bagian dari norma kesopanan." },
            { id: 17, level: 2, text: "Berbohong kepada orang tua untuk menutupi kesalahan adalah pelanggaran terhadap norma...", options: ["Hukum", "Lalu lintas", "Kesusilaan", "Pemerintah"], answer: 2, explanation: "Berbohong mengingkari hati nurani yang tahu bahwa itu salah (kesusilaan)." },
            { id: 18, level: 2, text: "Siswa wajib memakai seragam yang rapi ke sekolah. Ini adalah contoh...", options: ["Aturan keluarga", "Aturan sekolah", "Aturan negara", "Aturan agama"], answer: 1, explanation: "Seragam adalah aturan tata tertib yang berlaku di lingkungan sekolah." },
            { id: 19, level: 2, text: "Membuang sampah pada tempatnya di lingkungan kampung merupakan kepatuhan pada aturan di...", options: ["Rumah", "Sekolah", "Masyarakat", "Negara"], answer: 2, explanation: "Menjaga kebersihan lingkungan sekitar adalah tanggung jawab warga masyarakat." },
            { id: 20, level: 2, text: "Jika kita tidak sengaja merusakkan barang teman, sikap yang tepat sesuai norma adalah...", options: ["Pura-pura tidak tahu", "Menyalahkan orang lain", "Meminta maaf dan mengganti", "Lari menghindar"], answer: 2, explanation: "Bertanggung jawab atas kesalahan adalah penerapan norma kesusilaan dan kesopanan." },

            // LEVEL 3: MASTER NORMA (Penalaran/Kasus)
            { id: 21, level: 3, text: "Doni menemukan dompet jatuh di jalan yang sepi. Tidak ada orang yang melihat. Tindakan Doni yang sesuai norma kesusilaan adalah...", options: ["Mengambil uangnya", "Meninggalkannya", "Menyerahkan ke polisi/pemiliknya", "Membelikan makanan"], answer: 2, explanation: "Hati nurani yang bersih akan mendorong kita mengembalikan barang yang bukan milik kita." },
            { id: 22, level: 3, text: "Lampu lalu lintas menyala merah, tapi jalanan sangat sepi. Sikap pengendara yang taat hukum adalah...", options: ["Tetap berhenti", "Menerobos perlahan", "Membunyikan klakson lalu jalan", "Berputar arah"], answer: 0, explanation: "Hukum harus ditaati meskipun tidak ada yang mengawasi demi keselamatan bersama." },
            { id: 23, level: 3, text: "Kamu melihat temanmu sedang kesulitan membawa banyak buku. Tindakanmu sesuai norma kesopanan adalah...", options: ["Menertawakannya", "Menawarkan bantuan", "Melihat saja", "Melaporkan ke guru"], answer: 1, explanation: "Membantu orang yang kesulitan adalah bentuk kepedulian sosial dan sopan santun." },
            { id: 24, level: 3, text: "Sebuah peraturan daerah melarang membuang limbah ke sungai. Tujuan utama aturan hukum ini adalah...", options: ["Menghukum warga", "Menjaga kelestarian lingkungan", "Mendapatkan uang denda", "Membuat warga takut"], answer: 1, explanation: "Hukum lingkungan dibuat untuk melindungi alam agar tidak rusak dan bermanfaat bagi semua." },
            { id: 25, level: 3, text: "Dalam diskusi kelas, pendapatmu ditolak oleh teman-teman. Sikapmu sebaiknya...", options: ["Marah dan keluar kelas", "Menerima dengan lapang dada", "Memaksa agar diterima", "Mengejek pendapat teman"], answer: 1, explanation: "Menghargai perbedaan pendapat adalah cerminan norma kesopanan dalam demokrasi." },
            { id: 26, level: 3, text: "Membayar pajak tepat waktu merupakan kewajiban warga negara yang diatur dalam...", options: ["Norma agama", "Norma kesusilaan", "Norma kesopanan", "Norma hukum"], answer: 3, explanation: "Pajak diatur oleh undang-undang negara secara resmi." },
            { id: 27, level: 3, text: "Akibat sering melanggar aturan di sekolah, seorang siswa bisa mendapatkan sanksi berupa...", options: ["Penjara", "Dosa", "Teguran atau skorsing", "Denda jutaan rupiah"], answer: 2, explanation: "Sanksi sekolah disesuaikan dengan tingkat pelanggaran tata tertib edukatif." },
            { id: 28, level: 3, text: "Apa yang terjadi jika di dalam masyarakat tidak ada norma yang berlaku?", options: ["Hidup menjadi sangat bebas dan damai", "Masyarakat akan kacau dan hukum rimba berlaku", "Ekonomi akan maju pesat", "Semua orang akan menjadi kaya"], answer: 1, explanation: "Tanpa aturan, yang kuat akan menindas yang lemah, sehingga terjadi kekacauan." },
            { id: 29, level: 3, text: "Menaati aturan di rumah bermanfaat untuk...", options: ["Membuat orang tua pusing", "Menciptakan keluarga yang harmonis", "Mendapatkan hadiah mahal", "Terlihat hebat di depan teman"], answer: 1, explanation: "Aturan rumah dibuat agar semua anggota keluarga merasa nyaman dan rukun." },
            { id: 30, level: 3, text: "Disiplin berarti...", options: ["Taat dan patuh pada aturan", "Melakukan sesuatu sesuka hati", "Hanya taat jika ada guru", "Menunda-nunda pekerjaan"], answer: 0, explanation: "Sikap disiplin ditunjukkan dengan kepatuhan pada aturan di manapun berada." }
        ];

        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const App = () => {
            // States
            const [gameState, setGameState] = useState('START'); // START, NAME, MENU, MATERI, PLAY, GAMEOVER, LEVEL_COMPLETE, WIN
            const [playerName, setPlayerName] = useState('');
            const [score, setScore] = useState(0);
            const [lives, setLives] = useState(3);
            const [currentLevel, setCurrentLevel] = useState(1);
            const [questions, setQuestions] = useState([]);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [streak, setStreak] = useState(0);
            const [audioEnabled, setAudioEnabled] = useState(true);
            const [isFullscreen, setIsFullscreen] = useState(false);
            
            // Statistics for end screen
            const [stats, setStats] = useState({ correct: 0, wrong: 0, totalQuestions: 0 });

            // Game mechanics states
            const [currentOptions, setCurrentOptions] = useState([]);
            const [animState, setAnimState] = useState('IDLE'); // IDLE, MOVING, CORRECT, WRONG
            const [selectedPlatform, setSelectedPlatform] = useState(null);
            const [showExplanation, setShowExplanation] = useState(false);
            const [explanationData, setExplanationData] = useState({ text: '', title: '', isCorrect: false, correctText: '', wrongText: '' });
            
            // Refs for animations
            const containerRef = useRef(null);
            const snakeRef = useRef(null);

            // Helpers
            const toggleAudio = () => setAudioEnabled(AudioEngine.toggle());
            
            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log(`Error attempting to enable fullscreen: ${err.message}`);
                    });
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            };

            useEffect(() => {
                const handleFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
            }, []);

            const startGame = () => {
                // Initialize game questions for Level 1
                AudioEngine.init();
                AudioEngine.playClick();
                setStats({ correct: 0, wrong: 0, totalQuestions: QUESTION_BANK.length });
                resetGame(1);
            };

            const resetGame = (level = 1) => {
                const levelQuestions = QUESTION_BANK.filter(q => q.level === level);
                // Shuffle questions
                const shuffledQuestions = levelQuestions.sort(() => Math.random() - 0.5);
                
                setQuestions(shuffledQuestions);
                setCurrentLevel(level);
                setCurrentQuestionIndex(0);
                if (level === 1) {
                     setScore(0);
                     setStats({ correct: 0, wrong: 0, totalQuestions: QUESTION_BANK.length });
                }
                setLives(3);
                setStreak(0);
                setGameState('PLAY');
                prepareQuestion(shuffledQuestions[0]);
            };

            const prepareQuestion = (question) => {
                if (!question) return;
                setAnimState('IDLE');
                setSelectedPlatform(null);
                setShowExplanation(false);
                
                // Shuffle options and keep track of correct answer
                const optionsWithIndex = question.options.map((opt, i) => ({ text: opt, originalIndex: i }));
                const shuffledOptions = optionsWithIndex.sort(() => Math.random() - 0.5);
                setCurrentOptions(shuffledOptions);
            };

            const handleAnswer = useCallback((selectedOptIndex, platformIndex) => {
                if (animState !== 'IDLE' || gameState !== 'PLAY' || showExplanation) return; // Prevent multiple clicks or acting outside play
                
                AudioEngine.playMove();
                setSelectedPlatform(platformIndex);
                setAnimState('MOVING');

                const currentQ = questions[currentQuestionIndex];
                const selectedOption = currentOptions[selectedOptIndex];
                const isCorrect = selectedOption.originalIndex === currentQ.answer;

                // Delay to simulate snake moving
                setTimeout(() => {
                    if (isCorrect) {
                        handleCorrect(currentQ);
                    } else {
                        handleWrong(currentQ);
                    }
                }, 800); // 800ms travel time
            }, [animState, gameState, showExplanation, questions, currentQuestionIndex, currentOptions]);

            // Keyboard controls mapping
            useEffect(() => {
                 const handleKeyDown = (e) => {
                      if (gameState === 'PLAY' && animState === 'IDLE' && !showExplanation) {
                          // Arrow keys map to platforms 0-3 (from bottom to top usually, but visual order might vary. Let's map 1-4 or arrows logically)
                          // Assuming visual order top-down is indices 0, 1, 2, 3
                          if (e.key === '1' || e.key === 'ArrowUp') handleAnswer(0, 0);
                          else if (e.key === '2' || e.key === 'ArrowRight') handleAnswer(1, 1);
                          else if (e.key === '3' || e.key === 'ArrowLeft') handleAnswer(2, 2);
                          else if (e.key === '4' || e.key === 'ArrowDown') handleAnswer(3, 3);
                      }
                 };
                 window.addEventListener('keydown', handleKeyDown);
                 return () => window.removeEventListener('keydown', handleKeyDown);
            }, [gameState, animState, showExplanation, handleAnswer]);


            const handleCorrect = (currentQ) => {
                setAnimState('CORRECT');
                AudioEngine.playCorrect();
                fireConfetti();
                
                let pointsEarned = 10;
                let newStreak = streak + 1;
                
                // Streak bonuses
                if (newStreak === 3) pointsEarned += 10;
                if (newStreak === 5) pointsEarned += 20;
                if (newStreak === 10) pointsEarned += 50;

                setScore(s => s + pointsEarned);
                setStreak(newStreak);
                setStats(prev => ({ ...prev, correct: prev.correct + 1 }));

                setExplanationData({
                    title: '🎉 BENAR!',
                    text: currentQ.explanation,
                    isCorrect: true,
                    correctText: 'Hebat! Jawabanmu tepat!'
                });
                
                setTimeout(() => setShowExplanation(true), 1500);
            };

            const handleWrong = (currentQ) => {
                setAnimState('WRONG');
                AudioEngine.playWrong();
                AudioEngine.playThunder();
                
                const newLives = lives - 1;
                setLives(newLives);
                setStreak(0);
                setScore(s => Math.max(0, s - 5));
                setStats(prev => ({ ...prev, wrong: prev.wrong + 1 }));

                setExplanationData({
                    title: '❌ BELUM TEPAT!',
                    text: currentQ.explanation,
                    isCorrect: false,

                                <button 
                                    onClick={() => {AudioEngine.playClick(); setGameState('MENU');}}
                                    className="btn-3d w-full bg-gray-400 hover:bg-gray-500 text-white cartoon-font text-lg py-3 rounded-xl border-b-4 border-gray-600 flex items-center justify-center gap-2"
                                >
                                    <span>🏠</span> MENU UTAMA
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return <div>Loading...</div>;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
